services:
  db:
    image: postgres:15
    container_name: flask_mdad_db
    environment:
      POSTGRES_DB: flaskdb
      POSTGRES_USER: flaskuser
      POSTGRES_PASSWORD: flaskpass
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  web:
    container_name: flask_mdad_web
    build: .
    image: flask-mdad:latest
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://flaskuser:flaskpass@db:5432/flaskdb
    # Ports stehen bewusst nur in docker-compose.override.yml (Entwicklung) bzw.
    # docker-compose.prod.yml (Produktion): Docker Compose fuegt Port-Listen
    # aus mehreren Dateien zusammen statt sie zu ersetzen.
    command: python app.py
