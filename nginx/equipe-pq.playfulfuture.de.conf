# Nginx-Konfiguration für die statische Landingpage equipe-pq
# Subdomain: equipe-pq.playfulfuture.de
# Dateien:   /home/henrik/Docker/flask-mdad/equipe-pq/  (index.html, impressum.html, datenschutz.html, custom.css, Bilder)
#
# Einrichten unter Ubuntu:
#   sudo cp equipe-pq.playfulfuture.de.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/equipe-pq.playfulfuture.de.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (Let's Encrypt), sobald der DNS-Eintrag auf den Server zeigt:
#   sudo certbot --nginx -d equipe-pq.playfulfuture.de
#   (certbot ergänzt die SSL-Zeilen und die Weiterleitung von http auf https automatisch)
#
# Wichtig: Nginx läuft als Benutzer www-data und muss bis in den Ordner lesen dürfen:
#   sudo chmod o+x /home/henrik /home/henrik/Docker /home/henrik/Docker/flask-mdad
#   sudo chmod -R o+rX /home/henrik/Docker/flask-mdad/equipe-pq

server {
    listen 80;
    listen [::]:80;
    server_name equipe-pq.playfulfuture.de;

    # Nur der Unterordner equipe-pq wird ausgeliefert - der Rest des Repos
    # (Python-Code, .git, docker-compose, Datenbank) bleibt unerreichbar.
    root /home/henrik/Docker/flask-mdad/equipe-pq;
    index index.html;

    charset utf-8;

    access_log /var/log/nginx/equipe-pq.access.log;
    error_log  /var/log/nginx/equipe-pq.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # Versteckte Dateien (.DS_Store, .git ...) und Markdown-Dateien
    # (z. B. prompt-statische-website.md) nicht ausliefern.
    location ~ /\. {
        deny all;
    }
    location ~* \.md$ {
        deny all;
    }

    # Bilder, CSS und Favicon eine Woche im Browser zwischenspeichern
    location ~* \.(?:css|png|jpe?g|webp|svg|ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
