# Nginx-Konfiguration für die Hauptseite (Flask-CMS flask-mdad)
# Domains:  playfulfuture.de (Hauptadresse) und www.playfulfuture.de (leitet weiter)
# Ersetzt:  mdad.trotro.de
# App:      Docker-Container "web" (gunicorn), erreichbar unter 127.0.0.1:5001
#           Start: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Einrichten unter Ubuntu:
#   sudo cp playfulfuture.de.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/playfulfuture.de.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (Let's Encrypt), sobald beide DNS-Einträge auf den Server zeigen:
#   sudo certbot --nginx -d playfulfuture.de -d www.playfulfuture.de
#   (certbot ergänzt die SSL-Zeilen und die Weiterleitung von http auf https automatisch)
#
# Statische Dateien (static/) und hochgeladene Bilder (data/uploads/, per
# Volume aus dem Container, siehe docker-compose.prod.yml) liefert Nginx direkt
# aus dem Projektordner aus, ohne Umweg über Flask. Dafür muss www-data lesen
# dürfen (data/ nur durchqueren, data/postgres bleibt geschützt):
#   sudo chmod o+x /home/henrik /home/henrik/Docker /home/henrik/Docker/flask-mdad
#   sudo chmod -R o+rX /home/henrik/Docker/flask-mdad/static
#   sudo chmod o+x /home/henrik/Docker/flask-mdad/data
#   sudo chmod -R o+rX /home/henrik/Docker/flask-mdad/data/uploads
# Werden Bilder trotzdem nicht angezeigt, den location-Block /uploads/ unten
# entfernen - dann liefert Flask sie über dieselbe Adresse aus.

# www.playfulfuture.de -> playfulfuture.de (eine einheitliche Adresse für Suchmaschinen)
server {
    listen 80;
    listen [::]:80;
    server_name www.playfulfuture.de;

    return 301 $scheme://playfulfuture.de$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name playfulfuture.de;

    charset utf-8;

    access_log /var/log/nginx/playfulfuture.access.log;
    error_log  /var/log/nginx/playfulfuture.error.log;

    # Uploads im Bedienfeld (Bilder, CSV-/ZIP-Import) bis 16 MB, passend zu
    # MAX_CONTENT_LENGTH in views.py. Ohne diese Zeile lehnt Nginx alles
    # über 1 MB ab, bevor Flask es überhaupt sieht.
    client_max_body_size 16M;

    location / {
        proxy_pass http://127.0.0.1:5001;  # gunicorn im web-Container
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CSV-Import/Export kann bei vielen Bildern etwas dauern
        proxy_read_timeout 120s;
    }

    location /static/ {
        alias /home/henrik/Docker/flask-mdad/static/;
        expires 7d;
        access_log off;
    }

    location /uploads/ {
        alias /home/henrik/Docker/flask-mdad/data/uploads/;
        expires 7d;
        access_log off;
    }

    # Versteckte Dateien (.git, .DS_Store ...) nie ausliefern
    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
