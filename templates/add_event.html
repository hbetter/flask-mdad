{% extends "base.html" %}
{% block content %}
<div class="container py-4">
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h3 class="mb-4">Neuen Termin hinzufügen</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Titel</label>
                        <input type="text" name="title" id="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Eventkategorie</label>
                        <select name="category" id="category" class="form-select" required>
                            {% for key, label in event_categories %}
                            <option value="{{ key }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Untertitel</label>
                        <input type="text" name="subtitle" class="form-control" maxlength="300">
                    </div>
                    <div class="mb-3 all-day-toggle">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="all_day" id="all_day" value="1">
                            <label class="form-check-label" for="all_day">Ganztägig</label>
                        </div>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col">
                            <label class="form-label fw-bold">Startdatum</label>
                            <input type="date" name="starts_at_date" class="form-control" required>
                        </div>
                        <div class="col time-field">
                            <label class="form-label fw-bold">Startzeit</label>
                            <input type="time" name="starts_at_time" class="form-control">
                        </div>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col">
                            <label class="form-label fw-bold">Enddatum</label>
                            <input type="date" name="ends_at_date" class="form-control" required>
                        </div>
                        <div class="col time-field">
                            <label class="form-label fw-bold">Endzeit</label>
                            <input type="time" name="ends_at_time" class="form-control">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Ort</label>
                        <textarea name="location" class="form-control" rows="5" required></textarea>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Speichern</button>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-link text-muted">Abbrechen</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Fuellt den Titel beim Anlegen eines Termins mit der gewaehlten
     Eventkategorie vor (z. B. "Webinar") - ersetzt das im oeffentlichen
     Bereich entfernte Kategorie-Badge (siehe index.html): die Kategorie
     steckt dadurch stattdessen im Titel selbst. Ueberschreibt einen von
     Hand getippten Titel nicht - nur solange das Feld leer ist oder noch
     den zuletzt automatisch eingetragenen Wert enthaelt. -->
<script>
(function () {
    var categorySelect = document.getElementById('category');
    var titleInput = document.getElementById('title');
    if (!categorySelect || !titleInput) return;

    var lastAutoFill = '';

    function currentCategoryLabel() {
        var option = categorySelect.options[categorySelect.selectedIndex];
        return option ? option.textContent : '';
    }

    function applyAutoFill() {
        if (titleInput.value === '' || titleInput.value === lastAutoFill) {
            lastAutoFill = currentCategoryLabel();
            titleInput.value = lastAutoFill;
        }
    }

    categorySelect.addEventListener('change', applyAutoFill);
    applyAutoFill();
})();
</script>
{% endblock %}
