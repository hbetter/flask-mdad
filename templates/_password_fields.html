{# Neues Passwort mit Wiederholung (Passwort ändern/zurücksetzen, Einladung) #}
{%- set pw_min = password_policy().min_length %}
<div class="mb-3">
    <label class="form-label fw-bold" for="password">Neues Passwort</label>
    <input type="password" class="form-control" id="password" name="password" minlength="{{ pw_min }}"
           autocomplete="new-password" required aria-describedby="password_help">
    <div id="password_help" class="form-text">{{ password_policy_text() }}</div>
</div>
<div class="mb-3">
    <label class="form-label fw-bold" for="password_confirm">Neues Passwort wiederholen</label>
    <input type="password" class="form-control" id="password_confirm" name="password_confirm" minlength="{{ pw_min }}"
           autocomplete="new-password" required>
</div>
