<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>ActiveCampaign Formulare – Vollständige Embed-Codes</title>

  <!-- Google Font: Open Sans (identisch zur Website, siehe base.html /
       static/css/custom.css) statt des urspruenglichen Roboto, damit die
       Formulare sich in den Fliesstext der Seite einfuegen. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Einheitliches Formular-Styling: ausgelagert nach
       static/css/ac-formulare.css (siehe dort), damit es nicht in
       custom.css landet, sondern ueberall einbindbar ist, wo ein
       AC-Formular eingesetzt wird. Relativer Pfad (nicht url_for()):
       diese Seite hat keine eigene Flask-Route und wird direkt als
       Datei geoeffnet, Jinja wird hier also nie ausgewertet. -->
  <link rel="stylesheet" href="../static/css/ac-formulare.css">
</head>
<body>



  <!-- ============================================================ -->
  <!-- 1. NEWSLETTER-ANMELDUNG – MENSCH DENK AN DICH (ID: 14)       -->
  <!-- ============================================================ -->
  <div class="_form_14"></div>
  <script src="https://smeo.activehosted.com/f/embed.php?id=14" type="text/javascript" charset="utf-8"></script>

  <!-- ============================================================ -->
  <!-- 2. IMPULSWORKSHOP ANMELDUNG – MENSCH DENK AN DICH (ID: 11)  -->
  <!-- ============================================================ -->
  <div class="_form_11"></div>
  <script src="https://smeo.activehosted.com/f/embed.php?id=11" type="text/javascript" charset="utf-8"></script>


  <!-- ============================================================ -->
  <!-- 3. SPIELE-COACH ANMELDUNG – MENSCH DENK AN DICH (ID: 8)     -->
  <!-- ============================================================ -->
  <div class="_form_8"></div>
  <script src="https://smeo.activehosted.com/f/embed.php?id=8" type="text/javascript" charset="utf-8"></script>

    <!-- ============================================================ -->
  <!-- 4. SPIELRAUM ANMELDUNG – MENSCH DENK AN DICH (ID: 16)     -->
  <!-- ============================================================ -->
  <div class="_form_16"></div>
  <script src="https://smeo.activehosted.com/f/embed.php?id=16" type="text/javascript" charset="utf-8"></script>

  <!-- Erzwingt per Inline-Style die wenigen Werte, die ActiveCampaign
       selbst per !important setzt, und blendet vergangene Termine aus
       den Auswahllisten aus. Ausgelagert nach static/js/ac-formulare.js
       (siehe dort fuer die volle Begruendung). Relativer Pfad aus dem
       gleichen Grund wie beim CSS oben (keine Flask-Route hier). -->
  <script src="../static/js/ac-formulare.js" defer></script>

</body>
</html>
