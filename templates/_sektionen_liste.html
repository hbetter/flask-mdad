{% for section in sections %}
{% call m.section_card(section.kicker, section.title) %}
        {% if section.description %}
        <p class="fs-5 mb-4">{{ section.description }}</p>
        {% endif %}
        {% if section.image_filename %}
        <div class="row gy-5 align-items-center">
          <div class="col-lg-6">
            <div class="card-text preserve-lines">{{ section.body|safe }}</div>
          </div>
          <div class="col-lg-6">
            <img
              src="{{ url_for('static', filename='uploads/' ~ section.image_filename) }}"
              alt="{{ section.title }}"
              class="img-fluid rounded"
            >
          </div>
        </div>
        {% else %}
        <div class="card-text preserve-lines">{{ section.body|safe }}</div>
        {% endif %}
{% endcall %}
{% endfor %}
