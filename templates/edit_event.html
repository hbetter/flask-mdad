{% extends "base.html" %}
{% block content %}
<div class="container py-4">
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h3 class="mb-4">Termin bearbeiten</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Titel</label>
                        <input type="text" name="title" class="form-control" value="{{ event.title }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Art des Termins</label>
                        <select name="event_type" class="form-select" required>
                            {% for key, label in event_types %}
                            <option value="{{ key }}" {% if event.event_type == key %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Eventkategorie</label>
                        <select name="category" class="form-select" required>
                            {% for key, label in event_categories %}
                            <option value="{{ key }}" {% if event.category == key %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Untertitel</label>
                        <input type="text" name="subtitle" class="form-control" maxlength="300" value="{{ event.subtitle or '' }}">
                    </div>
                    <div class="mb-3 all-day-toggle">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="all_day" id="all_day" value="1" {% if event.all_day %}checked{% endif %}>
                            <label class="form-check-label" for="all_day">Ganztägig</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Datum</label>
                        <input type="date" name="starts_at_date" class="form-control" value="{{ event.starts_at|dateinput }}" required>
                    </div>
                    <div class="mb-3 time-field">
                        <label class="form-label fw-bold">Uhrzeit</label>
                        <input type="time" name="starts_at_time" class="form-control" value="{{ event.starts_at|timeinput }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Ort</label>
                        <textarea name="location" class="form-control" rows="5" required>{{ event.location }}</textarea>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Speichern</button>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-link text-muted text-decoration-none">Abbrechen</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</div>
{% endblock %}
