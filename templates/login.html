{% extends "base.html" %}
{% block content %}
<div class="container py-4">
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h3 mb-4">Login</h1>
                {% include "_flashes.html" %}
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">E-Mail-Adresse oder Nutzername</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            autocomplete="username"
                            required
                            autofocus
                        >
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">Passwort</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Anmelden</button>
                    </div>
                </form>
                <p class="small mt-3 mb-0"><a href="{{ url_for('members.password_reset_request') }}">Passwort vergessen?</a></p>
            </div>
        </div>
    </div>
</div>
</div>
{% endblock %}
